<style>
/* Layout: one calm column, a sticky header with the student menu, one main action per screen. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E6ECEE; --line:#CFD9DC;
  --ink:#13232B; --muted:#4F626B;
  --primary:#0C6A66; --primary-ink:#FFFFFF; --primary-soft:#D5EDEA;
  --accent:#B86E00; --accent-soft:#FBEBD0;
  --good:#1B7A3E; --good-soft:#DCF1E3; --warn:#9A3B12; --warn-soft:#F9E2D7;
  --focus:#1A5FD1;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171C; --surface:#152229; --sunk:#1C2C34; --line:#2C3F48;
  --ink:#E6EEF1; --muted:#9DB0B8;
  --primary:#3FBFB4; --primary-ink:#06201E; --primary-soft:#173B3A;
  --accent:#F0B44C; --accent-soft:#3A2C12;
  --good:#5BD08A; --good-soft:#163524; --warn:#F39A73; --warn-soft:#3A2018;
  --focus:#7FB0FF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#152229; --sunk:#1C2C34; --line:#2C3F48;
  --ink:#E6EEF1; --muted:#9DB0B8;
  --primary:#3FBFB4; --primary-ink:#06201E; --primary-soft:#173B3A;
  --accent:#F0B44C; --accent-soft:#3A2C12;
  --good:#5BD08A; --good-soft:#163524; --warn:#F39A73; --warn-soft:#3A2018;
  --focus:#7FB0FF; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand span{color:var(--primary)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:8px 12px;border-radius:999px;border:1px solid transparent;min-height:40px;display:inline-flex;align-items:center}
.nav a[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}
main{padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(30px,7vw,46px);font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:15px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.hero{padding-block:24px 8px}
.btn{font:inherit;font-weight:700;font-size:16px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary);padding-inline:10px}
.btn.big{font-size:18px;min-height:56px;padding-inline:26px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .ico{font-size:18px;line-height:1}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stepbar{display:flex;flex-direction:column;gap:8px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps i{height:6px;border-radius:3px;background:var(--sunk)}
.steps i.done{background:var(--primary)}
.steps i.now{background:var(--accent)}
.es{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,52px);letter-spacing:-.015em;line-height:1.05}
.es-md{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,6vw,32px);line-height:1.2}
.icon-big{font-size:44px;line-height:1}
.pic{font-size:clamp(72px,22vw,112px);line-height:1;text-align:center;padding-block:8px;background:var(--sunk);border-radius:var(--r)}
.scene{display:flex;justify-content:center;align-items:center;gap:6px;font-size:clamp(40px,12vw,60px);line-height:1;background:var(--sunk);border-radius:var(--r);padding:12px;flex-wrap:wrap}
.scene .plus{font-size:24px;color:var(--muted)}
.p-yo{--pc:#2F6FE0}.p-tu{--pc:#1B8A5A}.p-el{--pc:#C2600A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-yo{--pc:#7FA8FF} :root:not([data-theme="light"]) .p-tu{--pc:#5BD08A} :root:not([data-theme="light"]) .p-el{--pc:#F2A65A}}
:root[data-theme="dark"] .p-yo{--pc:#7FA8FF} :root[data-theme="dark"] .p-tu{--pc:#5BD08A} :root[data-theme="dark"] .p-el{--pc:#F2A65A}
.who-chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--pc);color:var(--pc);border-radius:999px;padding:2px 10px;font-weight:800;font-family:var(--f-display)}
.end-mark{color:var(--pc);font-weight:800;text-decoration:underline;text-underline-offset:4px}
.whogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.whocard{border:2px solid var(--pc);border-radius:var(--r);padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.whocard .em{font-size:44px;line-height:1}
.whocard b{font-family:var(--f-display);font-size:22px;color:var(--pc)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{font:inherit;min-height:120px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.tile .em{font-size:clamp(48px,14vw,64px);line-height:1}
.tile:hover:not([disabled]){border-color:var(--primary)}
.tile.right{border-color:var(--good);background:var(--good-soft)}
.tile.wrong{border-color:var(--warn);background:var(--warn-soft)}
.tile.sel{border-color:var(--primary);background:var(--primary-soft)}
.tile.gone{opacity:.35}
.tile .lbl{font-family:var(--f-display);font-weight:700;font-size:19px}
.build{min-height:64px;border:2px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wtile{font:inherit;font-family:var(--f-display);font-weight:700;font-size:20px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px 14px;min-height:48px;cursor:pointer}
.wtile.used{opacity:.3}
.guide{font-family:var(--f-mono);font-size:16px;background:var(--sunk);border-radius:8px;padding:6px 10px;display:inline-block;overflow-wrap:anywhere}
.guide b{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:15.5px}
.note{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--muted)}
.fb{border-radius:12px;padding:14px 16px;font-weight:500}
.fb.ok{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.fb.no{background:var(--warn-soft);color:var(--ink);border-left:5px solid var(--warn)}
.fb strong{display:block;font-family:var(--f-display);font-size:19px;margin-bottom:2px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:20px;font-weight:600;text-align:left;min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.opt.chosen{border-color:var(--primary);background:var(--primary-soft)}
.sentence{font-family:var(--f-display);font-size:clamp(24px,6vw,30px);font-weight:700}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.pron{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.pron .es-md{font-size:22px}
.chip{font:inherit;font-size:15px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.model{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;font-weight:700}
.model .pill{background:var(--primary-soft);color:var(--primary);border-radius:10px;padding:4px 10px}
.model .end{color:var(--accent)}
table.who{border-collapse:collapse;width:100%}
table.who td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.who td:first-child{font-family:var(--f-display);font-weight:700;font-size:22px;width:30%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.stat{display:flex;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat:last-child{border-bottom:0}
.stat b{font-family:var(--f-display);font-size:18px}
.badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted)}
.badge.good{background:var(--good-soft);color:var(--good)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item>div:first-child{min-width:0;flex:1 1 220px}
input[type=text],textarea{font:inherit;font-size:18px;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.frame{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.frame:last-of-type{border-bottom:0}
.frame-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.frame-head .es-md{font-size:22px}
.conf{display:flex;gap:8px;flex-wrap:wrap}
.conf .chip{min-width:48px;justify-content:center}
.banner{border-radius:10px;padding:10px 14px;font-size:15px;background:var(--warn-soft);color:var(--ink)}
.rec{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rec .dot{width:12px;height:12px;border-radius:50%;background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(92vw,520px);font-size:15.5px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.celebrate{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--primary)}
.cando li{margin-block:6px}
.cando{padding-left:22px;margin:0}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
footer{padding-block:24px 40px;color:var(--muted);font-size:14px}
select{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs .chip{min-height:44px;font-size:16px}
.words-check{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-display);font-size:20px;font-weight:700}
.words-check span{padding:2px 8px;border-radius:8px}
.words-check .hit{background:var(--good-soft);color:var(--good)}
.words-check .miss{background:var(--warn-soft);color:var(--warn);text-decoration:underline dotted}
.live{font-family:var(--f-display);font-size:19px;min-height:1.5em;color:var(--muted)}
.echo{font-weight:700;color:var(--accent);min-height:1.4em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soundgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.soundcard{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:110px}
.soundcard:hover{border-color:var(--primary)}
.soundcard .big{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--primary)}
.qa{font-family:var(--f-display);font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.15}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* ============ CONTENT (lesson 1) ============ */
const LESSONS = [{
  id: "s01", num: 1, classDate: "Nov 10",
  canDo: "Pick the right verb for yo, tú, él and ella.",
  grammar: {
    title: "Who is doing it?",
    intro: "In Spanish, the end of the verb changes depending on who does the action.",
    rows: [["yo","I"],["tú","you"],["él","he"],["ella","she"]],
    rule: "For regular <strong>-ar</strong> verbs, remove <strong>-ar</strong>. Add <strong>-o</strong> for yo, <strong>-as</strong> for tú, and <strong>-a</strong> for él or ella.",
    models: [
      ['<span class="pill">estudi<span class="end">ar</span></span> → <span>yo</span> + <span class="pill">estudi<span class="end">o</span></span>', "= I study"],
      ['<span>tú</span> + <span class="pill">estudi<span class="end">as</span></span>', "= you study"],
      ['<span>él / ella</span> + <span class="pill">estudi<span class="end">a</span></span>', "= he / she studies"]
    ],
    example: {html:'Yo <span class="blank">estudio</span> español.', say:"Yo estudio español.", en:"I study Spanish. Yo means I, so estudiar becomes estudio."},
    note: "Mi amigo, mi amiga and mi hermana are one person, like él or ella, so they also use -a."
  },
  title: "Mi mundo en español",
  titleEn: "My world in Spanish",
  goal: "Say what you and other people do, using yo, tú, él and ella with regular -ar verbs.",
  unit: "School unit: to be confirmed",
  words: [
    {es:"estudiar", en:"to study", icon:"📚", guide:"es-too-<b>DYAR</b>", tip:"Three beats: es-tu-diar. Keep each vowel short and clean."},
    {es:"escuchar", en:"to listen (to)", icon:"🎧", guide:"es-koo-<b>CHAR</b>", tip:"ch sounds like the ch in “chair”."},
    {es:"practicar", en:"to practice", icon:"🏋️", guide:"prahk-tee-<b>KAR</b>", tip:"Both c’s sound like k."},
    {es:"dibujar", en:"to draw", icon:"✏️", guide:"dee-boo-<b>HAR</b>", tip:"The j is a breathy h from the back of your throat."},
    {es:"preparar", en:"to prepare", icon:"🍳", guide:"preh-pah-<b>RAR</b>", tip:"Each r here is a quick tap, like the tt in American “butter”."},
    {es:"música", en:"music", icon:"🎵", guide:"<b>MOO</b>-see-kah", tip:"The accent mark shows the strong part: MÚ."},
    {es:"amigo", en:"friend", icon:"🤝", guide:"ah-<b>MEE</b>-goh", tip:"End with a short, clean o. Don’t slide into “oh-oo”."},
    {es:"escuela", en:"school", icon:"🏫", guide:"es-<b>KWEH</b>-lah", tip:"ue sounds like “weh”."}
  ],
  phrases: [
    {es:"Yo estudio español.", en:"I study Spanish.", guide:"yoh es-<b>TOO</b>-dyoh es-pah-<b>NYOHL</b>", tip:"With yo, estudiar ends in -o: estudio. The ñ is close to the “ny” in “canyon”, so listen to the audio."},
    {es:"Tú escuchas música.", en:"You listen to music.", guide:"too es-<b>KOO</b>-chahs <b>MOO</b>-see-kah", tip:"Keep the final s in escuchas. With tú, the verb ends in -as."},
    {es:"Mi amigo practica fútbol.", en:"My friend practices soccer.", guide:"mee ah-<b>MEE</b>-goh prahk-<b>TEE</b>-kah <b>FOOT</b>-bohl", tip:"Mi amigo is like él (he), so the verb ends in -a. Fútbol is strong on FÚT."},
    {es:"Mi hermana dibuja un personaje.", en:"My sister draws a character.", guide:"mee ehr-<b>MAH</b>-nah dee-<b>BOO</b>-hah oon pehr-soh-<b>NAH</b>-heh", tip:"The h in hermana is silent. The j in dibuja and personaje is a breathy h."}

  /* bank: diag = starting check (C1–C4) · practice = practice set · transfer = new sentences, only in the final check.

  exercises: [
    {id:"e1", es:"Yo ___ español.", en:"I ___ Spanish.", verb:"study", ok:"estudio", others:["estudias","estudia"], who:"yo", bank:"diag", check:true},

    {id:"e3", es:"Mi amigo ___ fútbol.", en:"My friend ___ soccer.", verb:"practices", ok:"practica", others:["practico","practicas"], who:"mi amigo", bank:"diag", check:true},

    {id:"e8", es:"Él ___ para su clase.", en:"He ___ for his class.", verb:"practices", ok:"practica", others:["practicas","practico"], who:"él", bank:"practice"},

const LOG_KEY = "clases-espanol.log.v1";
const Log = {
  q:[], dev:null, sess:null, t:null, sending:false,
  init(){
    try{ this.q = JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); }catch(e){ this.q = []; }
    try{ this.dev = localStorage.getItem(LOG_KEY+".dev"); if(!this.dev){ this.dev = Math.random().toString(36).slice(2,10); localStorage.setItem(LOG_KEY+".dev", this.dev); } }catch(e){ this.dev = "nostore"; }
    this.sess = Date.now().toString(36);
    this.ev("open", {view: location.hash.slice(1) || "home", lesson: DB.current, snap: snapshot()});
    document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ this.ev("leave", {snap: snapshot()}); this.flush(true); } });
    setInterval(()=>this.flush(), 60000);
  },
  ev(type, data){
    const e = Object.assign({t:new Date().toISOString(), type, stu:STUDENT_CODE, dev:this.dev, ses:this.sess, l:DB.current}, data || {});
    this.q.push(e); if(this.q.length>800) this.q = this.q.slice(-800);
    this.persist(); clearTimeout(this.t); this.t = setTimeout(()=>this.flush(), 4000);
  },
  persist(){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(this.q)); }catch(e){} },
  flush(leaving){
    if(!LOG_CONFIG.action || !LOG_CONFIG.field || !this.q.length || this.sending) return;
    const batch = this.q.slice(0, 40);
    const body = new URLSearchParams(); body.append(LOG_CONFIG.field, JSON.stringify(batch));
    const done = ()=>{ this.q = this.q.slice(batch.length); this.persist(); this.sending = false; if(this.q.length) setTimeout(()=>this.flush(), 1500); };
    if(leaving && navigator.sendBeacon){
      try{ if(navigator.sendBeacon(LOG_CONFIG.action, new Blob([body.toString()], {type:"application/x-www-form-urlencoded"}))) done(); }catch(e){}
      return;
    }
    this.sending = true;
    try{
      fetch(LOG_CONFIG.action, {method:"POST", mode:"no-cors", body}).then(done, ()=>{ this.sending = false; });
    }catch(e){ this.sending = false; }
  }
};

/* ============ VOICE (text to speech) ============ */
const Voice = {
  ok: !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance !== "undefined", list: [], loaded:false,
  rank(v){const l=v.lang.replace("_","-").toLowerCase(); return l==="es-mx"?0:l==="es-us"?1:l==="es-419"?2:l.startsWith("es")?3:9;},
  init(){
    if(!this.ok) return;
    const loadV = ()=>{
      const all = speechSynthesis.getVoices();
      if(!all.length) return;
      this.loaded = true;
      this.list = all.filter(v=>/^es([-_]|$)/i.test(v.lang)).sort((a,b)=>this.rank(a)-this.rank(b));
      if(ui.view==="listen") render();
    };
    loadV();
    if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", loadV); else speechSynthesis.onvoiceschanged = loadV;
    setTimeout(()=>{ if(!this.loaded){ this.loaded = true; if(ui.view==="listen") render(); } }, 2500);
  },
  pick(){ return this.list.find(v=>v.voiceURI===DB.voice) || this.list[0] || null; },
  speak(text, rate, onend){
    this.seq = null; setEcho(null);
    return this._speak(text, rate, onend);
  },
  _speak(text, rate, onend){
    if(!this.ok){ toast("This browser can’t play spoken audio. You can still read the words and the sound guide."); return false; }
    Rec.stop(); Check.stop();
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = this.pick();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = "es-MX"; }
      u.rate = rate || 1;
      u.onerror = e=>{ if(e.error!=="canceled" && e.error!=="interrupted") toast("The audio didn’t play. Check that your sound is on and try again."); };
      if(onend) u.onend = onend;
      speechSynthesis.speak(u);
      if(this.loaded && !this.list.length) toast("This device has no Spanish voice, so the audio may sound wrong. Ask your tutor how to add one.");
      return true;
    }catch(e){ toast("The audio didn’t play. Try again."); return false; }
  },
  /* Repeat after me: slow → medium → normal, with a pause to repeat after each */
  echo(text, key){
    this.stop();
    if(!this.ok){ toast("This browser can’t play spoken audio, so Repeat after me isn’t available. Read the sound guide and say it out loud."); return; }
    const rates = [0.6, 0.8, 1], token = {}; let i = 0;
    this.seq = token;
    const gap = Math.max(1800, text.length * 110);
    const next = ()=>{
      if(this.seq!==token) return;
      if(i>=rates.length){ this.seq = null; setEcho({key, done:true}); return; }
      setEcho({key, n:i+1, phase:"listen"});
      this._speak(text, rates[i], ()=>{
        if(this.seq!==token) return;
        setEcho({key, n:i+1, phase:"you"});
        setTimeout(()=>{ i++; next(); }, gap);
      });
    };
    next();
  },
  stop(){ this.seq = null; if(this.ok) try{speechSynthesis.cancel();}catch(e){} }
};

function setEcho(st){
  ui.echo = st;
  document.querySelectorAll("[data-echo]").forEach(el=>{
    if(!st || st.key!==el.dataset.echo){ el.textContent = ""; return; }
    el.textContent = st.done ? "Nice. Do it again anytime." : st.phase==="listen" ? `Listen (${st.n} of 3${st.n===1?", slow":st.n===2?", a bit faster":", normal speed"})…` : `Your turn. Say it out loud now (${st.n} of 3).`;
  });
}
function echoRow(text, key){
  return `<div class="stack-sm"><div class="row"><button class="btn" data-a="echo" data-t="${esc(text)}" data-k="${key}">↻ Repeat after me</button></div>
    <p class="echo" data-echo="${key}" aria-live="polite"></p></div>`;
}

/* ============ WORD CHECK (speech to text) ============ */
const Check = {
  dict:null, SR:(window.SpeechRecognition || window.webkitSpeechRecognition || null), rec:null,
  active:false, key:null, expected:"", partial:"", final:"", heard:{},
  init(){
    try{
      if(window.claude && typeof window.claude.use==="function"){
        window.claude.use("dictation").then(d=>{
          if(!d) return;
          this.dict = d;
          d.onPartial(e=>{ this.partial = e.text; this.live(); });
          d.onFinal(e=>{ this.final += e.text; this.live(); });
          d.onState(e=>{
            if(e.state==="idle" && this.active){
              this.active = false;
              if(e.reason && !["stopped","viewer_stopped","hidden"].includes(e.reason)) this.fail(e.reason);
              this.finish();
            }
          });
          render();
        }).catch(()=>{});
      }
    }catch(e){}
  },
  available(){ return !!(this.dict || this.SR); },
  start(key, expected){
    Voice.stop(); Rec.stop();
    this.key = key; this.expected = expected; this.partial = ""; this.final = ""; delete this.heard[key];
    this.active = true;
    if(this.dict){
      this.dict.start({language:"es-MX"}).catch(e=>{ this.active = false; this.fail(e && e.code); render(); });
      render(); return;
    }
    try{
      const r = new this.SR(); this.rec = r;
      r.lang = "es-MX"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
      r.onresult = e=>{ let f = "", p = ""; for(let i=0;i<e.results.length;i++){ const x = e.results[i]; if(x.isFinal) f += x[0].transcript; else p += x[0].transcript; } this.final = f; this.partial = p; this.live(); };
      r.onerror = e=>{ if(e.error!=="aborted" && e.error!=="no-speech") this.fail(e.error); if(e.error==="no-speech") toast("We didn’t hear anything. Tap Check my words and speak right after."); };
      r.onend = ()=>{ if(this.active){ this.active = false; this.finish(); } };
      r.start(); render();
    }catch(e){ this.active = false; this.fail("start"); render(); }
  },
  stop(){
    if(!this.active) return;
    if(this.dict){ this.dict.stop().catch(()=>{}); }
    else if(this.rec){ try{ this.rec.stop(); }catch(e){} }
  },
  live(){ const el = document.getElementById("chk-live"); if(el) el.textContent = (this.final + " " + this.partial).trim() || "Listening… say it now."; },
  finish(){ const t = (this.final + " " + this.partial).trim(); if(t){ this.heard[this.key] = t; const cmp = compareWords(this.expected, t); Log.ev("word_check", {target:this.expected, heard:t, missed:cmp.filter(x=>!x.hit).map(x=>x.w)}); } render(); },
  fail(code){
    const m = (code==="not_granted" || code==="not-allowed" || code==="service-not-allowed") ? "Microphone access is off, so the word check is skipped. You can still listen and repeat out loud."
      : code==="unavailable" ? "The word check isn’t available here. You can still listen and repeat out loud."
      : code==="rate_limited" ? "The word check is busy. Wait a moment and try again."
      : code==="dismissed" ? "No problem. Tap Check my words when you’re ready."
      : code==="network" ? "The word check needs an internet connection. Try again when you’re online."
      : "The word check didn’t work this time. Try again, or just repeat out loud.";
    toast(m);
  }
};
function norm(w){ return w.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ]/g,""); }
function compareWords(expected, heard){
  const hw = heard.split(/\s+/).map(norm).filter(Boolean);
  let j = 0;
  return expected.split(/\s+/).filter(Boolean).map(w=>{
    const n = norm(w); let k = hw.indexOf(n, j);
    if(k<0) k = hw.indexOf(n);
    if(k>=0){ j = k+1; return {w, hit:true}; }
    return {w, hit:false};
  });
}
function checkRow(key, expected){
  if(!Check.available()) return `<p class="small muted">Word check (speech to text) isn’t available in this browser. Listen and repeat out loud instead.</p>`;
  if(Check.active && Check.key===key){
    return `<div class="stack-sm"><p class="live" id="chk-live" aria-live="polite">Listening… say it now.</p>
      <div class="row"><button class="btn primary" data-a="chkstop">■ I’m done</button></div></div>`;
  }
  const h = Check.heard[key];
  let out = `<div class="row"><button class="btn" data-a="chk" data-k="${key}" data-t="${esc(expected)}">🎙 Check my words</button></div>`;
  if(h){
    const cmp = compareWords(expected, h), miss = cmp.filter(x=>!x.hit).map(x=>x.w.replace(/[¿?¡!.,]/g,""));
    out += `<div class="stack-sm"><span class="label">We heard</span><p lang="es">“${esc(h)}”</p>
      <div class="words-check" lang="es">${cmp.map(x=>`<span class="${x.hit?"hit":"miss"}">${esc(x.w)}</span>`).join("")}</div>
      <p class="${miss.length?"tip":"fb ok"}">${miss.length ? `We didn’t catch: <strong lang="es">${esc(miss.join(", "))}</strong>. Listen to the model and try those words again.` : "We understood every word. Nice!"}</p>
      <p class="small muted">This checks whether your words were understood. It doesn’t grade your accent.</p></div>`;
  }
  return `<div class="stack-sm">${out}</div>`;
}

/* ============ RECORDER (optional, local only) ============ */
const Rec = {
  mr:null, stream:null, chunks:[], key:null, urls:{}, t0:0, tick:null, cap:null, state:"idle",
  supported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  async start(key){
    Voice.stop(); this.stop();
    if(!this.supported()){ toast("Recording isn’t available in this browser. Listen and repeat out loud instead. That works just as well."); return; }
    try{ this.stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){
      const m = (e && e.name==="NotAllowedError") ? "Microphone access is off, so recording is skipped. You can still listen and repeat out loud."
              : (e && e.name==="NotFoundError") ? "No microphone was found. You can still listen and repeat out loud."
              : "Recording didn’t start. You can still listen and repeat out loud.";
      toast(m); return;
    }
    const types = ["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg"];
    const mime = types.find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    try{ this.mr = new MediaRecorder(this.stream, mime?{mimeType:mime}:undefined); }
    catch(e){ this.release(); toast("Recording didn’t start. You can still listen and repeat out loud."); return; }
    this.chunks = []; this.key = key; this.state = "recording";
    this.mr.ondataavailable = e=>{ if(e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.onstop = ()=>{
      const k = this.key;
      if(this.chunks.length){
        if(this.urls[k]) URL.revokeObjectURL(this.urls[k]);
        this.urls[k] = URL.createObjectURL(new Blob(this.chunks, {type:this.mr.mimeType || "audio/webm"}));
      }
      this.release(); this.state = "idle"; render();
    };
    this.mr.start(); this.t0 = Date.now();
    this.tick = setInterval(()=>{ const el=document.getElementById("rec-time"); if(el) el.textContent = Math.min(20,Math.floor((Date.now()-this.t0)/1000))+"s / 20s"; }, 250);
    this.cap = setTimeout(()=>this.stop(), 20000);
    render();
  },
  stop(){
    clearInterval(this.tick); clearTimeout(this.cap);
    if(this.mr && this.mr.state==="recording"){ try{ this.mr.stop(); }catch(e){ this.release(); this.state="idle"; } }
  },
  release(){ if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream = null; } },
  play(key){ const u = this.urls[key]; if(!u) return; Voice.stop(); const a = new Audio(u); a.play().catch(()=>toast("Your recording didn’t play. Try recording again.")); },
  clearAll(){ this.stop(); this.release(); Object.values(this.urls).forEach(u=>URL.revokeObjectURL(u)); this.urls = {}; }
};
function stopMedia(){ Voice.stop(); setEcho(null); Rec.stop(); Check.stop(); }

/* ============ EXERCISE RUNS ============ */
function bank(kind){
  const L = lesson();
  if(kind==="practice") return L.exercises.filter(e=>e.bank==="practice");
  if(kind==="diag") return L.exercises.filter(e=>e.bank==="diag");
  if(kind==="mistakes"){ const ids = mistakeIds(); return L.exercises.filter(e=>ids.includes(e.id)); }
  return L.exercises.filter(e=>e.check).concat(L.exercises.filter(e=>e.bank==="transfer")); // final check
}
function newRun(kind, where){
  return {kind, where, items:bank(kind).map(e=>({id:e.id, order:shuffle([e.ok].concat(e.others)), first:null, help:0, meaning:false, tries:[]})), i:0, startedAt:Date.now(), saved:false};
}
function exById(id){ return lesson().exercises.find(e=>e.id===id); }
function finishRun(run){
  if(run.saved) return;
  run.saved = true;
  const items = run.items.map(it=>({id:it.id, chosen:it.first, ok:it.first===exById(it.id).ok, help:it.help>0||it.meaning}));
  Log.ev("set_done", {kind:run.kind, score:items.filter(x=>x.ok&&!x.help).length+"/"+items.length, items});
  prog().runs.push({kind:run.kind, at:Date.now(), items:run.items.map(it=>({id:it.id, chosen:it.first, correct:it.first===exById(it.id).ok, help:it.help>0 || it.meaning}))});
  save();
}
const KIND_NAME = {practice:"Practice set", diag:"Starting check", check:"Final check", mistakes:"Review your mistakes", warmup:"Warm-up"};
/* Exercises whose most recent first answer was wrong or needed help (current lesson). */
function mistakeIds(id){
  const last = {};
  prog(id).runs.forEach(r=>r.items.forEach(x=>{ last[x.id] = x; }));
  return Object.keys(last).filter(k=>!last[k].correct || last[k].help);
}
function scoreOf(r){ const c = r.items.filter(x=>x.correct && !x.help).length; return {c, n:r.items.length}; }
function lastRun(kind){ const rs = prog().runs.filter(r=>r.kind===kind); return rs[rs.length-1] || null; }

function runView(run, opts){
  opts = opts || {};
  const it = run.items[run.i], e = exById(it.id), w0 = WHO[e.who] || {en:"", why:""}, w = {en:w0.en, why:e.why || w0.why};
  const answered = it.tries.length > 0;
  const lastTry = it.tries[it.tries.length-1];
  const isRight = lastTry === e.ok;
  const hints = run.kind==="practice" || run.kind==="mistakes";
  let h = `<div class="stack">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Question ${run.i+1} of ${run.items.length}</span>${run.kind==="check" && e.bank==="transfer" ? '<span class="badge">New sentence</span>' : ''}</div>
    <p class="muted">Choose the word that completes the sentence.</p>
    ${sceneHTML(e.es)}
    <p class="sentence" lang="es">${blankify(e.es)}</p>
    <div class="row">
      <button class="btn" data-a="say" data-t="${esc(fill(e.es,"…"))}"><span class="ico" aria-hidden="true">🔊</span>Listen</button>
      ${hints ? `<button class="btn" data-a="meaning" ${it.meaning?'disabled':''}>Show meaning</button>
      <button class="btn" data-a="exhelp" ${it.help?'disabled':''}>I need help</button>` : ''}
    </div>
    ${it.meaning ? `<p class="note">Meaning: <strong>${esc(e.en.replace(" ___", e.verb ? " "+e.verb : "").replace("___", e.verb))}</strong></p>` : ''}
    ${it.help ? (e.help ? `<p class="tip"><strong>Hint:</strong> ${esc(e.help)}</p>` : `<p class="tip"><strong>Who is doing it?</strong> ${esc(e.who)} = ${esc(w.en)}. ${esc(w.why)}</p>`) : ''}
    <div class="opts" role="group" aria-label="Answer choices">
      ${it.order.map(o=>{
        const cls = answered && lastTry===o ? (o===e.ok?"right":"wrong") : "";
        const dis = answered && (isRight || lastTry===o) ? "disabled" : "";
        return `<button class="opt ${cls}" lang="es" data-a="answer" data-o="${esc(o)}" ${dis}>${esc(o)}</button>`;
      }).join("")}
    </div>`;
  if(answered){
    if(isRight){
      h += `<div class="fb ok" role="status"><strong>Correct!</strong>${e.who ? `With ${esc(e.who)}, use <span lang="es">${esc(e.ok)}</span>. ` : ""}${esc(w.why)}<br><span lang="es">${esc(e.es).replace("___", endingHTML(e.ok, e.who || personOf(e.es)))}</span> = ${esc(e.en.replace("___",e.verb))}</div>`;
    } else {
      h += `<div class="fb no" role="status"><strong>Not yet. Try this pattern.</strong>${e.who ? `${esc(e.who)} + <span lang="es">${esc(e.ok)}</span>. ` : ""}${esc(w.why)}</div>`;
    }
    if(!isRight || it.first!==e.ok) h += `<p class="small muted">Only your first answer counts in your progress. Trying again helps you learn.</p>`;
  }
  h += `<div class="row">`;
  if(answered && !isRight) h += `<button class="btn primary" data-a="retry">Try again</button>`;
  if(answered && isRight) h += `<button class="btn primary big" data-a="nextq">${run.i+1<run.items.length ? "Next question" : "See result"}</button>`;
  h += `</div></div>`;
  return h;
}
function runSummary(run){
  const s = scoreOf({items:run.items.map(it=>({correct:it.first===exById(it.id).ok, help:it.help>0||it.meaning}))});
  return s;
}

function ptItems(t){ return PT.filter(x=>t.stages.includes(x.st)); }
function ptScore(t, st){ const xs = PT.filter(x=>x.st===st); return {c:xs.filter(x=>t.answers[x.id]===x.ok).length, n:xs.length}; }
function ptBand(t){
  const s1 = ptScore(t,1).c, s2 = t.stages.includes(2) ? ptScore(t,2).c : -1, s3 = t.stages.includes(3) ? ptScore(t,3).c : -1;
  if(s1<4) return PT_BANDS[0];
  if(s1<PT_PASS[1]) return PT_BANDS[1];
  if(s2<PT_PASS[2]) return PT_BANDS[2];
  if(s3<5) return PT_BANDS[3];
  return PT_BANDS[4];
}

const GAME_NAME = {tap:"Listen & tap the picture", match:"Match the pairs", build:"Build the sentence"};
function newGame(kind){
  const L = lesson();
  if(kind==="tap"){
    const ws = shuffle(L.words).slice(0,6);
    return {kind, i:0, right:0, rounds:ws.map(w=>({w, opts:shuffle([w].concat(shuffle(L.words.filter(x=>x!==w)).slice(0,3))), pick:null}))};
  }
  if(kind==="match"){
    const ws = shuffle(L.words).slice(0,4);
    return {kind, ws, pics:shuffle(ws.map(w=>w.es)), labels:shuffle(ws.map(w=>w.es)), selPic:null, done:[], miss:0};
  }
  const phs = shuffle(L.phrases).slice(0,3);
  return {kind, i:0, right:0, rounds:phs.map(ph=>{ const toks = ph.es.replace(/[.,!?¿¡]/g,"").split(/\s+/); return {ph, toks, bank:shuffle(toks.map((t,j)=>({t,j}))), built:[], checked:null}; })};
}

  </div>`;
}

function buildRecall(P){
  const words = shuffle(P.words), items = [];
  const others = w=>shuffle(P.words.filter(x=>x.en!==w.en)).slice(0,2).map(x=>x.en);
  words.slice(0,2).forEach(w=>items.push({type:"word", es:w.es, ok:w.en, opts:shuffle([w.en].concat(others(w))), why:`${w.es} = ${w.en}. ${w.tip}`}));
  { const w = words[2]; items.push({type:"pic", es:w.es, icon:w.icon, ok:w.es, opts:shuffle([w.es].concat(shuffle(P.words.filter(x=>x!==w)).slice(0,2).map(x=>x.es))), why:`${w.icon} = ${w.es} (${w.en}).`}); }
  words.slice(3,5).forEach(w=>items.push({type:"listen", es:w.es, ok:w.en, opts:shuffle([w.en].concat(others(w))), why:`You heard “${w.es}” = ${w.en}.`}));
  shuffle(P.exercises).slice(0,3).forEach(e=>items.push({type:"gram", id:e.id, es:e.es, en:e.en.replace("___", e.verb), ok:e.ok, opts:shuffle([e.ok].concat(e.others)), why:e.why || (WHO[e.who]||{}).why || ""}));
  const ph = shuffle(P.phrases)[0];
  return {lid:P.id, items, i:0, answers:{}, speak:{es:ph.es, en:ph.en, guide:ph.guide, said:null}, done:false, started:Date.now()};
}

function recallResult(R, P){
  const n = R.items.length, c = R.items.filter((x,i)=>R.answers[i]===x.ok).length;
  const hist = recallHistory(P.id), prevQuiz = hist.length>1 ? hist[hist.length-2] : null;

  const remembered = R.items.filter((x,i)=>R.answers[i]===x.ok && x.type!=="gram").map(x=>x.es);
  const missed = R.items.filter((x,i)=>R.answers[i]!==x.ok);
  const pct = v=>Math.round(v*100);
  let growth = "";
  if(prevQuiz) growth = `Last warm-up: ${prevQuiz.c} of ${prevQuiz.n}. Today: ${c} of ${n}.`;
  else if(lastCheck) growth = `In Class ${P.num} you got ${lastCheck.c} of ${lastCheck.n} on your own. Today, days later, you remembered ${pct(c/n)}%.`;
  const msg = c===n ? "Everything stuck. That’s real learning." : c>=n*0.75 ? "Most of it stuck. Nice work." : c>=n*0.5 ? "You kept a good part of it. Today’s class builds on it." : "This is normal after a few days. A quick review now makes it stick.";

function compRes(k){ const r = prog().comp && prog().comp[k]; return r ? `<span class="badge">Last: ${r.right} of ${r.total}</span>` : `<span class="badge">Not done yet</span>`; }
function viewPractice(){

      <div class="grid2">${[["tap","🔊→🖼️"],["match","🖼️↔️🔤"],["build","🧩"]].map(([k,em])=>`<button class="soundcard" data-a="gstart" data-k="${k}"><span class="big" aria-hidden="true">${em}</span><strong>${GAME_NAME[k]}</strong>${(prog().games||{})[k] ? `<span class="badge good">Played ${(prog().games||{})[k]}×</span>` : ""}</button>`).join("")}</div></div>

function viewListen(){

function voiceNote(){

  if(Voice.loaded && !Voice.list.length) return `<p class="banner">This device has no Spanish voice, so the audio may sound wrong. On iPhone: Settings › Accessibility › Spoken Content › Voices › Spanish (Mexico).</p>`;
  if(Voice.list.length>1) return `<div class="row"><label for="voicesel" class="small muted">Voice</label><select id="voicesel" data-a="voice">${Voice.list.map(v=>`<option value="${esc(v.voiceURI)}" ${Voice.pick()===v?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select></div>`;

}

        <div class="row">${[0,2].map(o=>`<button class="btn" data-a="say" data-t="${esc(sd.pairs[q.pair][o])}" data-r="0.8">🔊 ${esc(sd.pairs[q.pair][o])}</button>`).join("")}<button class="btn primary" data-a="qplay">Next word</button></div>` : ""}

function summaryText(){
  const L = lesson(), p = prog(), sc = k=>{const r=lastRun(k); return r?`${scoreOf(r).c}/${scoreOf(r).n}`:"not done";};

  return [`Clases de Español — Lesson ${L.num} (${L.title})`, ...others, ptSummary(),
    `Warm-ups: ${Object.entries(DB.recall||{}).map(([k,v])=>`Class ${(LESSONS.find(x=>x.id===k)||{}).num} ${v.map(r=>r.c+"/"+r.n).join(", ")}`).join("; ") || "none yet"}`,

/* ============ RENDER + ROUTER ============ */
const VIEWS = {home:viewHome, lesson:viewLesson, lessons:viewLessons, words:viewWords, practice:viewPractice, listen:viewListen, progress:viewProgress, guide:viewGuide, review:viewReview, recall:viewRecall, notes:viewNotes, placement:viewPlacement, project:()=>`<div class="stack">${stepProject(true)}</div>`};
const NAV_OF = {guide:"home", lesson:"home", project:"progress", notes:"lessons", review:"lessons", recall:"home", placement:"home"};
function render(keepFocus){
  const main = $("#main");
  const active = document.activeElement;
  const fid = keepFocus && active && active.id;
  main.innerHTML = (/github\.io$/.test(location.hostname) || location.protocol==="file:" ? "" : `<p class="banner" style="margin-bottom:16px"><strong>This site has moved.</strong> Please use the new link from now on: <a href="https://gentemexico.github.io/clases-de-espanol/" target="_blank" rel="noopener">gentemexico.github.io/clases-de-espanol</a></p>`) + (VIEWS[ui.view] || viewHome)();
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.nav===(NAV_OF[ui.view]||ui.view) ? "page" : "false"));
  if(fid){ const el = document.getElementById(fid); if(el){ el.focus(); if(el.setSelectionRange && el.value!=null) el.setSelectionRange(el.value.length, el.value.length); } }
}
function go(view, noHash){
  stopMedia();
  ui.help = false; ui.open = null; ui.confirmReset = false; ui.quitNote = false;
  if(ui.run && ui.run.where==="tab" && view!=="practice") ui.run = null;
  if(view!=="practice"){ ui.comp = null; ui.game = null; }
  ui.ptQuitAsk = false;
  if(ui.pt && ui.pt.done) ui.pt = null;
  ui.view = VIEWS[view] ? view : "home";
  Log.ev("view", {view:ui.view});
  if(!noHash){ try{ history.replaceState(null, "", "#"+ui.view); }catch(e){ location.hash = ui.view; } }
  render();
  window.scrollTo(0,0);
  const m = $("#main"); m.focus({preventScroll:true});
}
window.addEventListener("hashchange", ()=>{ const v = location.hash.slice(1); if(v && v!==ui.view) go(v, true); });

/* ============ ACTIONS ============ */
function currentRun(){ return ui.run; }
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");
  if(nav){ e.preventDefault(); go(nav.dataset.nav); return; }
  const el = e.target.closest("[data-a]"); if(!el || el.tagName==="INPUT" || el.tagName==="SELECT") return;
  const a = el.dataset.a, p = prog(), L = lesson();
  switch(a){
    case "notesfor": DB.current = el.dataset.l; save(); go("notes"); break;
    case "reviewfor": DB.current = el.dataset.l; save(); Log.ev("review_open", {lesson:el.dataset.l}); go("review"); break;
    case "revgo": { const k = el.dataset.k; Log.ev("review_go", {lesson:DB.current, k});
      if(k==="games"){ go("practice"); }
      else if(k==="quiz"){ ui.recall = Object.assign(buildRecall(L), {free:true}); go("recall"); }
      else if(k==="notes" || k==="words" || k==="project") go(k);
      else if(k==="lesson"){ const q = prog(); ui.w = {i:0, phase:0}; ui.gram = "learn"; ui.ph = 0; ui.run = null; ui.checkStarted = false; if(q.finishedAt){ DB.lessons[DB.current] = Object.assign(blankLesson(), {confStart:q.confStart, runs:q.runs, everFinished:q.finishedAt||q.everFinished, comp:q.comp, sounds:q.sounds, talked:q.talked, project:q.project}); save(); } go("lesson"); }
      else if(k==="read" || k==="listen"){ go("practice"); const d = k==="read" ? L.reading : L.listening; ui.comp = {kind:k, answers:{}, plays:0, showT:false, orders:d.qs.map(q=>shuffle([q.ok].concat(q.others)))}; render(); }
      else if(k==="talk"){ go("listen"); ui.lsTab = "talk"; ui.talk = {i:0, phase:0}; render(); }
      else { go("practice"); ui.run = newRun(k, "tab"); render(); }
      break; }
    case "pickl": DB.current = el.dataset.l; ui.game = null; save(); render(); break;
    case "startlesson":
      { const target = LESSONS.find(x=>x.id===(el.dataset.l||DB.current)); const P = prevLesson(target);
        if(P && !(DB.warmDone||{})[target.id] && !ui.skipWarm){ DB.current = target.id; save(); ui.recall = buildRecall(P); Log.ev("warmup_start", {of:P.id}); go("recall"); break; } }
      if(el.dataset.l && el.dataset.l!==DB.current){ DB.current = el.dataset.l; save(); const q = prog(); if(q.finishedAt){ const keep = {confStart:q.confStart, runs:q.runs, everFinished:q.finishedAt||q.everFinished, comp:q.comp, sounds:q.sounds, talked:q.talked, project:q.project, hw:q.hw}; DB.lessons[DB.current] = Object.assign(blankLesson(), keep); save(); } ui.w = {i:0, phase:0}; ui.gram = "learn"; ui.ph = 0; ui.run = null; ui.checkStarted = false; go("lesson"); break; }
      if(p.finishedAt){ const keep = {confStart:p.confStart, runs:p.runs, everFinished:p.finishedAt||p.everFinished, comp:p.comp, sounds:p.sounds, talked:p.talked, project:p.project, hw:p.hw}; DB.lessons[DB.current] = Object.assign(blankLesson(), keep); save(); }
      ui.w = {i:0, phase:0}; ui.gram = "learn"; ui.ph = 0; ui.run = null; ui.checkStarted = false;
      go("lesson"); break;
    case "conf": p[el.dataset.f] = +el.dataset.v; save(); Log.ev("confidence", {when:el.dataset.f, v:+el.dataset.v}); render(); break;
    case "say": Voice.speak(el.dataset.t, el.dataset.r ? +el.dataset.r : 1); break;
    case "togglehelp": ui.help = !ui.help; render(); break;
    case "back": back(); break;
    case "nextstep": stopMedia(); p.step = Math.min(4, p.step+1); Log.ev("step", {step:p.step+1}); ui.help = false; if(p.step===1) ui.gram="learn"; if(p.step===2) ui.ph = 0; if(p.step===4){ ui.checkStarted=false; ui.run=null; } save(); render(); window.scrollTo(0,0); break;
    case "wlisten": { const w = L.words[ui.w.i]; Voice.speak(w.es, 1); ui.w.phase = 1; render(); break; }
    case "wsaid": ui.w.phase = 2; render(); break;
    case "wmeaning": { const w = L.words[ui.w.i]; if(!p.wordsSeen.includes(w.es)){ p.wordsSeen.push(w.es); save(); } ui.w.phase = 3; render(); break; }
    case "wnext": ui.w = {i:ui.w.i+1, phase:0}; render(); break;
    case "gramstart": ui.gram = "run"; ui.run = newRun("practice","lesson"); render(); window.scrollTo(0,0); break;
    case "answer": {
      const run = currentRun(); const it = run.items[run.i]; const ex = exById(it.id); const o = el.dataset.o;
      if(it.tries[it.tries.length-1]===ex.ok) break;
      if(it.first===null){ it.first = o; Log.ev("answer", {kind:run.kind, id:it.id, chosen:o, ok:o===ex.ok, help:!!(it.help||it.meaning)}); }
      it.tries.push(o); render();
      const fb = document.querySelector(".fb"); if(fb) fb.scrollIntoView({block:"nearest"});
      break; }
    case "retry": { const run = currentRun(); const it = run.items[run.i]; it.tries = []; it.retrying = true; render(); break; }
    case "meaning": { const it = currentRun().items[currentRun().i]; it.meaning = true; render(); break; }
    case "exhelp": { const it = currentRun().items[currentRun().i]; it.help = 1; render(); break; }
    case "nextq": { const run = currentRun(); if(run.i+1<run.items.length){ run.i++; } else { run.done = true; finishRun(run); if(run.where==="lesson" && run.kind==="practice") ui.gram = "done"; } render(); window.scrollTo(0,0); break; }
    case "showsum": ui.checkStarted = true; ui.run = Object.assign(newRun("check","lesson"), {done:true, saved:true}); render(); break;
    case "checkstart": ui.checkStarted = true; ui.run = newRun("check","lesson"); render(); break;
    case "phnext": { const k = ui.ph; if(!p.phrasesDone.includes(k)){ p.phrasesDone.push(k); save(); } stopMedia(); ui.ph++; render(); window.scrollTo(0,0); break; }
    case "rec": Rec.start(el.dataset.k); Log.ev("record", {k:el.dataset.k}); break;
    case "echo": Rec.stop(); Check.stop(); Voice.echo(el.dataset.t, el.dataset.k); setEcho(ui.echo); break;
    case "chk": Check.start(el.dataset.k, el.dataset.t); break;
    case "chkstop": Check.stop(); break;
    case "ptstart": { ui.pt = {i:0, stages:[1], answers:{}, orders:Object.fromEntries(PT.map(x=>[x.id, shuffle([x.ok].concat(x.o))])), speak:false, speakMarks:{}, done:false}; render(); window.scrollTo(0,0); break; }
    case "ptplay": { const t = ui.pt, x = ptItems(t)[t.i]; t.plays = (t.plays||0)+1; Voice.speak(x.es, el.dataset.r ? +el.dataset.r : 0.95); break; }
    case "ptans": {
      const t = ui.pt, items = ptItems(t), x = items[t.i]; if(t.answers[x.id]) break;
      t.answers[x.id] = el.dataset.o; stopMedia();
      const lastOfStage = !items[t.i+1] || items[t.i+1].st!==x.st;
      if(lastOfStage){
        const st = x.st, sc = ptScore(t, st);
        if(st<3 && sc.c>=PT_PASS[st]){ t.stages.push(st+1); t.i++; }
        else t.speak = true;
      } else t.i++;
      render(); window.scrollTo(0,0); break; }
    case "ptmark": ui.pt.speakMarks[el.dataset.k] = el.dataset.v; render(); break;
    case "ptfinish": {
      const t = ui.pt; if(el.dataset.skip) t.speakMarks = {};
      const band = ptBand(t); t.bandId = band.id; t.done = true;
      const items = ptItems(t);
      DB.placement = {at:Date.now(), band:band.name, bandId:band.id, answers:t.answers, stages:t.stages,
        parts:t.stages.map(st=>Object.assign({st}, ptScore(t,st))),
        skills:["Listening","Vocabulary","Grammar","Reading"].map(sk=>{const xs = items.filter(x=>x.sk===sk); return {sk, c:xs.filter(x=>t.answers[x.id]===x.ok).length, n:xs.length};}).filter(x=>x.n),
        miss:[...new Set(items.filter(x=>t.answers[x.id]!==x.ok).map(x=>x.topic))], idk:items.filter(x=>t.answers[x.id]==="__idk").length,
        speak:Object.fromEntries(Object.entries(t.speakMarks).map(([k,v])=>[PT_SPEAK.find(x=>x.id===k).ask, ({yes:"said it",help:"with help",no:"not yet"})[v]]))};
      save(); Log.ev("placement_done", {result:DB.placement}); render(); window.scrollTo(0,0); break; }
    case "ptshow": { e.preventDefault(); const r = DB.placement; ui.pt = {done:true, bandId:r.bandId, answers:r.answers, stages:r.stages, speakMarks:{}}; 
      const m = {"said it":"yes","with help":"help","not yet":"no"}; PT_SPEAK.forEach(sp=>{ if(r.speak[sp.ask]) ui.pt.speakMarks[sp.id] = m[r.speak[sp.ask]]; }); render(); break; }
    case "ptquit": ui.ptQuitAsk = true; render(); break;
    case "ptquitno": ui.ptQuitAsk = false; render(); break;
    case "ptquityes": stopMedia(); ui.pt = null; ui.ptQuitAsk = false; render(); break;
    case "ptcopy": {
      const t = ptSummary(), box = $("#ptbox");
      const fallback = ()=>{ box.hidden = false; box.value = t; box.focus(); box.select(); toast("Select the text below and copy it."); };
      try{ navigator.clipboard.writeText(t).then(()=>toast("Copied. Paste it in a message to your tutor."), fallback); }catch(err){ fallback(); }
      break; }
    case "hwgo": { const [k, arg] = el.dataset.k.split(":");
      if(arg && arg.startsWith("s0")) DB.current = arg;
      if(k==="lesson"){ ui.w = {i:0, phase:0}; ui.gram = "learn"; ui.ph = 0; ui.run = null; ui.checkStarted = false; save(); go("lesson"); }
      else if(k==="talk" || k==="sounds"){ save(); go("listen"); ui.lsTab = k; if(k==="sounds") ui.sound = arg || "r"; ui.talk = {i:0, phase:0}; render(); }
      else { save(); go(k); }
      break; }
    case "guidedone": DB.guideSeen = true; save(); go("home"); break;
    case "rcstart": { const P = prevLesson(); if(!P) break; ui.recall = buildRecall(P); Log.ev("warmup_start", {of:P.id}); go("recall"); break; }
    case "rcans": { const R = ui.recall; if(R.answers[R.i]!=null) break; const x = R.items[R.i]; R.answers[R.i] = el.dataset.o;
      Log.ev("warmup_answer", {of:R.lid, type:x.type, q:x.es, chosen:el.dataset.o, ok:el.dataset.o===x.ok});
      if(x.type==="gram" && el.dataset.o!==x.ok){ const q = prog(R.lid); q.runs.push({kind:"warmup", at:Date.now(), items:[{id:x.id, chosen:el.dataset.o, correct:false, help:false}]}); save(); }
      if(x.type==="gram" && el.dataset.o===x.ok){ const q = prog(R.lid); q.runs.push({kind:"warmup", at:Date.now(), items:[{id:x.id, chosen:el.dataset.o, correct:true, help:false}]}); save(); }
      render(); break; }
    case "rcnext": stopMedia(); ui.recall.i++; render(); window.scrollTo(0,0); break;
    case "rcsay": ui.recall.speak.said = el.dataset.v; render(); break;
    case "rcfinish": { const R = ui.recall, n = R.items.length, c = R.items.filter((x,i)=>R.answers[i]===x.ok).length;
      DB.recall = DB.recall || {}; (DB.recall[R.lid] = DB.recall[R.lid] || []).push({at:Date.now(), c, n, speak:R.speak.said});
      if(!R.free){ DB.warmDone = DB.warmDone || {}; DB.warmDone[DB.current] = Date.now(); } R.done = true; save();
      Log.ev("warmup_done", {of:R.lid, score:c+"/"+n, speak:R.speak.said, missed:R.items.filter((x,i)=>R.answers[i]!==x.ok).map(x=>x.es)});
      render(); window.scrollTo(0,0); break; }
    case "rcskip": Log.ev("warmup_skip", {of:ui.recall && ui.recall.lid}); ui.skipWarm = true; ui.recall = null; go("home"); break;
    case "rcgo": { ui.skipWarm = true; const q = prog(); ui.w = {i:0, phase:0}; ui.gram = "learn"; ui.ph = 0; ui.run = null; ui.checkStarted = false; if(q.finishedAt){ DB.lessons[DB.current] = Object.assign(blankLesson(), {confStart:q.confStart, runs:q.runs, everFinished:q.finishedAt||q.everFinished, comp:q.comp, sounds:q.sounds, talked:q.talked, project:q.project, hw:q.hw}); save(); } go("lesson"); break; }
    case "gstart": stopMedia(); ui.game = newGame(el.dataset.k); Log.ev("game_start", {kind:el.dataset.k}); render(); window.scrollTo(0,0); if(ui.game.kind==="tap") Voice.speak(ui.game.rounds[0].w.es, 1); break;
    case "gquit": stopMedia(); ui.game = null; render(); break;
    case "gtap": { const G = ui.game, r = G.rounds[G.i]; if(r.pick) break; r.pick = el.dataset.v; if(r.pick===r.w.es) G.right++; Log.ev("game_answer", {kind:"tap", w:r.w.es, picked:r.pick}); render(); break; }
    case "gnext": { const G = ui.game; G.i++; stopMedia(); const done = G.i>=G.rounds.length; if(done) gameDone(G); render(); window.scrollTo(0,0); if(!done && G.kind==="tap") Voice.speak(G.rounds[G.i].w.es, 1); break; }
    case "gpic": { const G = ui.game; G.selPic = el.dataset.v; G.flash = null; const w = G.ws.find(x=>x.es===el.dataset.v); Voice.speak(w.es, 1); render(); break; }
    case "glbl": { const G = ui.game; if(!G.selPic) break; const ok = G.selPic===el.dataset.v; G.flash = {ok, es:G.selPic}; if(ok){ G.done.push(G.selPic); } else G.miss++; Log.ev("game_answer", {kind:"match", pic:G.selPic, picked:el.dataset.v}); G.selPic = null; if(G.done.length===G.ws.length) gameDone(G); render(); break; }
    case "gadd": { const r = ui.game.rounds[ui.game.i]; r.built.push(+el.dataset.j); r.checked = null; render(); break; }
    case "gunb": { const r = ui.game.rounds[ui.game.i]; r.built.splice(+el.dataset.k,1); r.checked = null; render(); break; }
    case "gcheck": { const G = ui.game, r = G.rounds[G.i]; const ok = r.built.map(j=>r.toks[j]).join(" ")===r.toks.join(" "); if(ok && r.checked!=="no" && !r.tried) G.right++; r.tried = r.tried || !ok; r.checked = ok ? "ok" : "no"; Log.ev("game_answer", {kind:"build", target:r.ph.es, built:r.built.map(j=>r.toks[j]).join(" "), ok}); if(ok) Voice.speak(r.ph.es, 1); render(); break; }
    case "gosounds": go("listen"); ui.lsTab = "sounds"; render(); break;
    case "compstart": { const d = el.dataset.k==="read" ? L.reading : L.listening;
      ui.comp = {kind:el.dataset.k, answers:{}, plays:0, showT:false, orders:d.qs.map(q=>shuffle([q.ok].concat(q.others)))}; render(); window.scrollTo(0,0); break; }
    case "compquit": stopMedia(); ui.comp = null; render(); break;
    case "compplay": { const d = ui.comp.kind==="read" ? L.reading : L.listening; ui.comp.plays++; Voice.speak(d.text, el.dataset.r ? +el.dataset.r : 0.9);
      const b = document.querySelector(".badge"); if(ui.comp.kind==="listen") render(); break; }
    case "compshow": ui.comp.showT = true; render(); break;
    case "compans": { const c = ui.comp, i = +el.dataset.i; if(c.answers[i]!=null) break; c.answers[i] = el.dataset.o;
      const d = c.kind==="read" ? L.reading : L.listening;
      if(d.qs.every((_,k)=>c.answers[k]!=null)){ p.comp = p.comp || {}; p.comp[c.kind] = {at:Date.now(), right:d.qs.filter((q,k)=>c.answers[k]===q.ok).length, total:d.qs.length, plays:c.plays}; save(); Log.ev("comp_done", Object.assign({kind:c.kind}, p.comp[c.kind])); }
      render(); break; }
    case "lstab": stopMedia(); ui.lsTab = el.dataset.k; ui.sound = null; ui.quiz = null; ui.open = null; render(); break;
    case "sopen": stopMedia(); ui.sound = el.dataset.k; ui.quiz = null; render(); window.scrollTo(0,0); break;
    case "sclose": stopMedia(); ui.sound = null; ui.quiz = null; render(); break;
    case "qplay": {
      const sd = SOUNDS.find(x=>x.id===ui.sound); const q = ui.quiz || {right:0,total:0};
      if(q.target && !q.picked){ Voice.speak(q.target, 0.85); break; }
      q.pair = Math.floor(Math.random()*sd.pairs.length); q.target = sd.pairs[q.pair][Math.random()<.5?0:2]; q.picked = null;
      ui.quiz = q; render(); Voice.speak(q.target, 0.85); break; }
    case "qpick": {
      const q = ui.quiz; if(!q || q.picked) break; q.picked = el.dataset.v; q.total++; if(q.picked===q.target) q.right++;
      p.sounds = p.sounds || {}; const r = p.sounds[ui.sound] = p.sounds[ui.sound] || {right:0,total:0}; r.total++; if(q.picked===q.target) r.right++; Log.ev("ear", {sound:ui.sound, heard:q.target, picked:q.picked});
      save(); render(); break; }
    case "tmean": ui.talk.phase = Math.max(ui.talk.phase, 1); render(); break;
    case "thelp": ui.talk.help = !ui.talk.help; render(); break;
    case "tmodel": Log.ev("talk", {q:talkList()[ui.talk.i].q}); ui.talk.phase = 2; p.talked = p.talked || []; if(!p.talked.includes(ui.talk.i)){ p.talked.push(ui.talk.i); save(); } render(); break;
    case "tnext": stopMedia(); ui.talk = {i: ui.talk.i+1<talkList().length ? ui.talk.i+1 : 0, phase:0}; render(); window.scrollTo(0,0); break;
    case "tprev": stopMedia(); ui.talk = {i: Math.max(0, ui.talk.i-1), phase:0}; render(); window.scrollTo(0,0); break;
    case "recstop": Rec.stop(); break;
    case "recplay": Rec.play(el.dataset.k); break;
    case "pchip": { p.project.fields[el.dataset.f] = el.dataset.v; save(); render(); break; }
    case "psay": Voice.speak(projectText(), el.dataset.r ? +el.dataset.r : 1); break;
    case "finishlesson": p.finishedAt = Date.now(); save(); Log.ev("lesson_done", {snap:snapshot()}); go("progress"); break;
    case "rshow": { ui.review.show = true; render(); break; }
    case "rknew": case "rhard": {
      const list = ui.review.filter==="hard" ? L.words.filter(w=>p.wordsHard.includes(w.es)) : L.words;
      const w = list[ui.review.i]; if(!w) break;
      if(!p.wordsSeen.includes(w.es)) p.wordsSeen.push(w.es);
      Log.ev("word_review", {w:w.es, r:a==="rhard"?"still learning":"knew"});
      if(a==="rhard"){ if(!p.wordsHard.includes(w.es)) p.wordsHard.push(w.es); ui.review.i++; }
      else { const was = p.wordsHard.indexOf(w.es); if(was>=0) p.wordsHard.splice(was,1); else ui.review.i++; }
      ui.review.show = false; save(); render(); break; }
    case "rnext": ui.review.i++; ui.review.show = false; stopMedia(); render(); break;
    case "rprev": ui.review.i = Math.max(0, ui.review.i-1); ui.review.show = false; stopMedia(); render(); break;
    case "rfilter": ui.review = {i:0, show:false, filter:el.dataset.v}; render(); break;
    case "runstart": ui.run = newRun(el.dataset.k, "tab"); ui.quitNote = false; render(); break;
    case "runquit": { const r = ui.run; ui.quitNote = !!(r && !r.done && r.items.some(x=>x.first!==null)); ui.run = null; stopMedia(); render(); break; }
    case "lopen": stopMedia(); ui.open = ui.open===el.dataset.k ? null : el.dataset.k; render(); break;
    case "copysum": { Log.ev("summary_copied", {snap:snapshot()});
      const t = summaryText(), box = $("#sumbox");
      const done = ()=>toast("Copied. Paste it in a message to your tutor.");
      const fallback = ()=>{ box.hidden = false; box.value = t; box.focus(); box.select(); toast("Select the text below and copy it."); };
      try{ navigator.clipboard.writeText(t).then(done, fallback); }catch(err){ fallback(); }
      break; }
    case "resetask": ui.confirmReset = true; render(); break;
    case "resetno": ui.confirmReset = false; render(); break;
    case "resetyes": DB.lessons[DB.current] = blankLesson(); save(); ui.confirmReset = false; ui.run = null; toast("Lesson "+L.num+" progress erased on this device."); render(); break;
  }
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.a==="pfield"){
    prog().project.fields[el.dataset.f] = el.value; save();
    const t = projectText(), out = $("#ptext");
    if(out) out.textContent = t || "Your sentences will appear here.";
    document.querySelectorAll('[data-a="psay"]').forEach(b=>b.disabled = !t);
    const nx = document.querySelector('[data-a="nextstep"]'); if(nx && ui.view==="lesson") nx.disabled = !t;
  }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.a==="hwtick"){ const p = prog(ASSIGNED); p.hw = p.hw || {}; p.hw[el.dataset.k] = el.checked; save(); Log.ev("hw_tick", {id:el.dataset.k, v:el.checked}); render(); }
  if(el.dataset && el.dataset.a==="pread"){ prog().project.read = el.checked; save(); Log.ev("project", {text:projectText(), readAloud:el.checked}); }
  if(el.dataset && el.dataset.a==="voice"){ DB.voice = el.value; save(); Voice.speak("Hola", 1); }
});
function back(){
  stopMedia(); ui.help = false;
  const p = prog();
  if(ui.view!=="lesson"){ go("home"); return; }
  const s = p.step;
  if(s===0){
    if(ui.w.i>=lesson().words.length){ ui.w = {i:lesson().words.length-1, phase:3}; }
    else if(ui.w.phase>0) ui.w.phase = 0;
    else if(ui.w.i>0) ui.w = {i:ui.w.i-1, phase:3};
    else { go("home"); return; }
  } else if(s===1){
    const run = ui.run;
    if(ui.gram==="run" && run && !run.done && run.i>0){ run.i--; }
    else if(ui.gram==="run" || ui.gram==="done"){ ui.gram = "learn"; ui.run = null; }
    else { p.step = 0; ui.w = {i:lesson().words.length, phase:0}; }
  } else if(s===2){
    if(ui.ph>0) ui.ph--; else { p.step = 1; ui.gram = lastRun("practice") ? "done" : "learn"; }
  } else if(s===3){ p.step = 2; ui.ph = lesson().phrases.length-1; }
  else if(s===4){
    const run = ui.run;
    if(run && run.kind==="check" && !run.done && run.i>0) run.i--;
    else { p.step = 3; ui.checkStarted = false; if(run && run.kind==="check" && !run.done) ui.run = null; }
  }
  save(); render(); window.scrollTo(0,0);
}
/* stop audio, recording and microphone when leaving or hiding the page */
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopMedia(); });
window.addEventListener("pagehide", ()=>Rec.clearAll());

/* ============ START ============ */
Voice.init();
Check.init();
try{ Log.init(); }catch(e){}
(function start(){
  const v = location.hash.slice(1);
  if(v && VIEWS[v]) ui.view = v;
  if(ui.view==="lesson"){ ui.w = {i:0, phase:0}; }
  render();
})();
</script>
